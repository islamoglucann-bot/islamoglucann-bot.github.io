<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CanoGames</title>
<meta name="description" content="CanoGames – çocuklar ve aileler için mobil oyunlar.">
<style>
:root{--bg:#fff8ef;--ink:#23305e;--muted:#5b6690;--card:#fff;--ring:#23305e;--a:#ff5f8f;--b:#7c5cff;--c:#ffb21f}
@media (prefers-color-scheme:dark){:root{--bg:#141a33;--ink:#f3f4ff;--muted:#b8bfdc;--card:#1e2647;--ring:#3b4680}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:56px 16px 32px;text-align:center;background:linear-gradient(135deg,#ffd666,#ff80ab 55%,#7c5cff);color:#fff}
h1{margin:0;font-size:clamp(34px,8vw,56px);letter-spacing:-.5px;text-shadow:0 3px 0 rgba(35,48,94,.25)}
header p{margin:8px 0 0;font-size:18px;opacity:.95}
main{max-width:860px;margin:0 auto;padding:32px 16px 48px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:3px solid var(--ring);border-radius:22px;padding:20px;box-shadow:0 5px 0 var(--ring)}
.card h2{margin:0 0 6px;font-size:21px}
.card p{margin:0;color:var(--muted)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:middle}
footer{text-align:center;color:var(--muted);font-size:14px;padding:0 16px 40px}
a{color:inherit}
</style>
</head>
<body>
<header>
  <h1>CanoGames</h1>
  <p>Çocuklar ve aileler için renkli mobil oyunlar</p>
</header>
<main>
  <div class="grid">
    <section class="card"><h2><span class="dot" style="background:var(--a)"></span>Boya Boya</h2><p>400'den fazla boyama sayfası, yapboz ve kelime oyunu.</p></section>
    <section class="card"><h2><span class="dot" style="background:var(--b)"></span>Kelime Kapan</h2><p>Harfleri birleştir, kelimeleri bul.</p></section>
    <section class="card"><h2><span class="dot" style="background:var(--c)"></span>Uzay Madeni</h2><p>Uzayda maden kaz, üssünü büyüt.</p></section>
  </div>
</main>
<footer>İletişim: <a href="mailto:canogamestudio@gmail.com">canogamestudio@gmail.com</a></footer>
</body>
</html>
